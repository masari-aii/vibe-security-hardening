name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Optional dependencies for reference-code tests
        run: |
          pip install pynacl argon2-cffi cryptography
          npm i --no-save --no-package-lock express nodemailer
      - name: Run test suite and benchmark
        run: python3 tests/run_tests.py --json benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: benchmark.json
